[package]
name = "switch"
description = "gvproxy-switch primitives: subnet arithmetic, MAC derivation, config rendering, the frame pump."
rust-version.workspace = true
version = "0.0.1"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The frame pump between a local frame carrier and gvproxy (`pump`). Both
# daemons turn it on; a build that only needs the address plan does not pull
# in tokio.
pump = ["dep:tokio", "dep:libc"]

[dependencies]
# The pump's sockets and timers.
tokio = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own tests turn the pump on. A dev-dependency shapes only this
# crate's test targets, never another crate's build.
switch = { path = ".", features = ["pump"] }
tempfile.workspace = true

[lints]
workspace = true
