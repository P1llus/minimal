# gvproxy (gvisor-tap-vsock), built from the pinned source plus every patch in
# vendor/gvproxy/patches/ applied in sorted order, by scripts/build-gvproxy.sh.
# scripts/fetch-gvproxy.sh builds an asset and checks it against its digest
# here. The build is reproducible (CGO_ENABLED=0, -mod=vendor, -trimpath,
# -buildvcs=false, fixed ldflags), so every host produces these bytes.
# Source: https://github.com/containers/gvisor-tap-vsock/releases/tag/v0.9.0
# `commit` is the resolved commit of `version` at pin time. The build fetches
# the commit, so a moved or deleted tag cannot change what we build.
version=v0.9.0
commit=6dbb5d4fa0033356c72a201346f8350594229868
# The Go toolchain the build uses, with the SHA-256 of each host's release
# archive from https://go.dev/dl/.
go=1.26.10
go-linux-amd64=ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5
go-linux-arm64=3f4227ce7b206a513e794f1393adb473a07b46e94d18bd15d1c684bbb7319797
go-darwin-arm64=0b5183492292ada170f9b561a834863808dd02edba599e4ad0e89899330020b3
# The SHA-256 of each carried patch. A patch that differs stops the build.
patch.0001-forwarder-unexpose-closes-accepted-connections.patch=65aa05c143c7c14b49bf841081105ee70b318eee2c985377bee549b7f0c92fd2
patch.0002-no-route-to-the-hosts-loopback.patch=8f33aa8fdf98566e1a4e78620a6b64af71f4830c312d07c02e3f6bf908708d42
# The SHA-256 of each asset the build produces. gvproxy-darwin is darwin-arm64.
gvproxy-linux-amd64=ad1ff6443547d4f7e6edc7414ad33437cb0483713053228ffb19adbfdbb3e350
gvproxy-linux-arm64=081273fda12291059a2977bcfde151dabe54932c75c668b70dc47626839f7b73
gvproxy-darwin=7dfab612c60723add7bad1fda9f5b07143b9225f3adf0f8115b4d8791dbe996c
